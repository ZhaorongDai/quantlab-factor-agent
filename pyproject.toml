[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quantlab-factor-agent"
version = "0.1.0"
description = "LLM-driven, mechanism-first formulaic factor research on quantlab, evaluated with KunQuant."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.3.0",
    "openai>=3.37.0",
    "psutil>=7.2.2",
    "pyyaml>=6.0.3",
    "quantlab-py",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
]
docs = [
    "myst-parser>=5.1.0",
    "numpydoc>=1.11.0",
    "pydata-sphinx-theme>=0.23.0",
    "sphinx>=9.1.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.7.0",
]

[tool.uv.sources]
quantlab-py = { path = "../quantlab", editable = true }

[tool.setuptools.packages.find]
where = ["."]
include = ["factor_agent*"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
