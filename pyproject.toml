[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quantlab-factor-agent"
version = "0.1.0"
description = "LLM-driven, mechanism-first formulaic factor research on quantlab, evaluated with KunQuant."
readme = "README.md"
license = "MIT AND Apache-2.0"
license-files = ["LICENSE", "factor_agent/KUNQUANT_LICENSE"]
requires-python = ">=3.13"
authors = [{ name = "Zhaorong Dai" }]
keywords = ["quant", "factor", "alpha", "llm", "agent", "kunquant", "quantlab"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "anthropic>=2.3.0",
    "openai>=3.37.0",
    "psutil>=7.2.2",
    "pyyaml>=6.0.3",
    # Needs quantlab's main, newer than the 0.2.0 on PyPI: pin the release that follows
    # 0.2.0 here before releasing this package (see CONTRIBUTING.md).
    "quantlab-py",
]

[project.urls]
Homepage = "https://github.com/ZhaorongDai/quantlab-factor-agent"
Repository = "https://github.com/ZhaorongDai/quantlab-factor-agent"
Documentation = "https://zhaorongdai.github.io/quantlab-factor-agent/"
Issues = "https://github.com/ZhaorongDai/quantlab-factor-agent/issues"
Changelog = "https://github.com/ZhaorongDai/quantlab-factor-agent/blob/main/CHANGELOG.md"

[project.optional-dependencies]
web = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
factor-agent-web = "factor_agent.web.app:main"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
]
docs = [
    "myst-parser>=5.1.0",
    "numpydoc>=1.11.0",
    "pydata-sphinx-theme>=0.23.0",
    "sphinx>=9.1.0",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.7.0",
]

[tool.uv.sources]
quantlab-py = { path = "../quantlab", editable = true }

[tool.setuptools.packages.find]
where = ["."]
include = ["factor_agent*"]
namespaces = false

[tool.setuptools.package-data]
"factor_agent" = ["KUNQUANT_LICENSE"]
# The frontend's built page, committed so that an install needs no Node.
"factor_agent.web" = ["static/**/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
