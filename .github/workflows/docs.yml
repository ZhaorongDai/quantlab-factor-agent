name: Docs

# Builds the documentation site (docs/conf.py) on every push and pull request, and
# deploys it to GitHub Pages from main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# quantlab is an editable path dependency (../quantlab), so the build checks out both
# repositories side by side: quantlab-factor-agent/ and quantlab/.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: quantlab-factor-agent
    steps:
      - uses: actions/checkout@v7
        with:
          path: quantlab-factor-agent

      - uses: actions/checkout@v7
        with:
          repository: ZhaorongDai/quantlab
          path: quantlab

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: quantlab-factor-agent/uv.lock

      - name: Install
        run: uv sync --group docs

      - name: Build
        # autodoc imports every module; a warning fails the build.
        run: uv run sphinx-build -W --keep-going -b html docs docs/_build/html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: quantlab-factor-agent/docs/_build/html

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
