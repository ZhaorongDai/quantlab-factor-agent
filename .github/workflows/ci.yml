name: CI

# A pull request runs on its merge ref. Pushes run only on main and on release tags, so
# a branch with an open pull request is not tested twice; run a branch without one by
# hand (workflow_dispatch).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  # Each commit on main has a group of its own: within a group a newer run cancels the
  # one running and replaces the one pending, which would leave a commit untested.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true

# quantlab is an editable path dependency (../quantlab), so the test job checks out both
# repositories side by side: quantlab-factor-agent/ and quantlab/. The package job builds
# without it and installs quantlab-py from PyPI, as `pip install quantlab-factor-agent` does.
jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: quantlab-factor-agent
    steps:
      - uses: actions/checkout@v7
        with:
          path: quantlab-factor-agent

      - uses: actions/checkout@v7
        with:
          repository: ZhaorongDai/quantlab
          path: quantlab

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: quantlab-factor-agent/uv.lock

      - name: Install libomp (macOS)
        # xgboost's macOS wheel links Homebrew's libomp.dylib and does not bundle it.
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Install
        # Not --locked: the lock records quantlab's dependencies as of the last lock, and
        # quantlab's main may have moved since. The web extra lets the frontend's route tests run.
        run: uv sync --dev --extra web

      - name: Test suite
        # No test calls a language model: the LLM backends are faked or replayed, and the
        # market is synthetic. KunQuant compiles with the runner's C++ compiler.
        run: uv run pytest -n auto -q

  page:
    # The frontend's built page is committed so that an install needs no Node; it must be
    # what its source builds to.
    name: page
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        working-directory: frontend
        run: npm ci && npm run build

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Compare with the committed page
        run: |
          git status --porcelain -- factor_agent/web/static
          test -z "$(git status --porcelain -- factor_agent/web/static)" || {
            echo "::error::factor_agent/web/static differs from what frontend/ builds: run 'npm ci && npm run build' in frontend/ and commit the result"
            exit 1
          }

  package:
    uses: ./.github/workflows/package.yml
