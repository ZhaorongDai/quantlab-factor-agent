# Seed directions (Q50): two per mechanism type, aimed at what the fundamental families of the reference
# (FundamentalAlpha, Barra's value, leverage and growth descriptors) lack. Approved by the user (2026-10-24).
# Papers are cited without their year, so no prompt names a date after the training segment; the years
# are in the comments.
directions:
  # Novy-Marx (2013), JFE.
  - "risk_compensation: gross profitability. Gross profit (revenue less cost of revenue) over total assets is the cleanest measure of economic profitability and predicts returns as strongly as book-to-market, and is nearly uncorrelated with it; gross profit, before the SG&A and interest that operating_profitability subtracts, scaled by assets and not by equity, and not the cash-based cash_profitability. Novy-Marx, The other side of value: the gross profitability premium, Journal of Financial Economics."
  # Novy-Marx (2011), Review of Finance.
  - "risk_compensation: operating leverage. Firms whose costs are largely fixed (high cost of revenue plus SG&A relative to assets) have profits more sensitive to demand shocks and earn a premium for that risk; the cost structure, not the profit margin or financial leverage (Barra desc_dtoa). Novy-Marx, Operating leverage, Review of Finance."
  # Cooper, Gulen and Schill (2008), JF.
  - "behavioural_bias: asset growth. Investors extrapolate past growth, so firms that expanded their total assets the most over the past year are overvalued and earn less; the year-on-year growth of total assets, broader than the change in PP&E and inventory of investment_to_assets and than the sales and earnings growth of Barra desc_sgro/desc_egro. Cooper, Gulen and Schill, Asset growth and the cross-section of stock returns, Journal of Finance."
  # Hirshleifer, Hou, Teoh and Zhang (2004), JAE.
  - "behavioural_bias: bloated balance sheets. Investors with limited attention fix on reported earnings and overlook how much of them has piled up as net operating assets (operating assets less operating liabilities: total assets less cash, less what is not debt or equity), so firms with high net operating assets over total assets earn less; the accumulated stock on the balance sheet, not this year's accrual flow (accruals). Hirshleifer, Hou, Teoh and Zhang, Do investors overvalue firms with bloated balance sheets?, Journal of Accounting and Economics."
  # Dichev (1998), JF; Campbell, Hilscher and Szilagyi (2008), JF.
  - "behavioural_bias: distress. Stocks with a high risk of failure (low retained earnings, working capital and EBIT relative to assets, high liabilities relative to market value, as in Altman's Z-score, or a high failure probability from leverage, losses and low cash) earn less, not more, than safe stocks, against a risk explanation; a combination of solvency ratios, not leverage alone (Barra desc_dtoa) or the F-score. Dichev, Is the risk of bankruptcy a systematic risk?, Journal of Finance; Campbell, Hilscher and Szilagyi, In search of distressed stocks, Journal of Finance."
  # Cohen, Diether and Malloy (2013), RFS.
  - "information_diffusion: misvaluing innovation. Investors ignore a firm's track record in turning R&D spending into sales growth, so among firms that spend on R&D those with a high past ability (sales growth per unit of past R&D) earn more; R&D productivity, not the R&D intensity of rd_to_market. Cohen, Diether and Malloy, Misvaluing innovation, Review of Financial Studies."
  # Soliman (2008), The Accounting Review.
  - "information_diffusion: DuPont decomposition. The change in asset turnover carries information about future profitability that prices take in slowly, while the change in profit margin carries less; the change of asset turnover (or of the margin) over a year, not the change of ROA as a whole (roa_change). Soliman, The use of DuPont analysis by market participants, The Accounting Review."
  # Abarbanell and Bushee (1998), The Accounting Review; Thomas and Zhang (2002), Review of Accounting Studies.
  - "information_diffusion: fundamental signals. Inventory or receivables growing faster than sales, and gross margin falling behind sales, signal weaker future earnings that prices incorporate only over the following quarters; the gap between the growth of a balance-sheet item and the growth of sales, not the revenue surprise (revenue_sue). Abarbanell and Bushee, Abnormal returns to a fundamental analysis strategy, The Accounting Review; Thomas and Zhang, Inventory changes and future returns, Review of Accounting Studies."
  # Lee and Swaminathan (2000), JF.
  - "liquidity: turnover and value. High-turnover stocks behave like glamour stocks and low-turnover ones like value stocks, and turnover predicts returns and the reversal of momentum beyond book-to-market; dollar volume relative to market capitalisation (amount over marketcap, which is split-safe) interacted with a valuation ratio, not turnover alone (Barra desc_stoa) or a valuation alone. Lee and Swaminathan, Price momentum and trading volume, Journal of Finance."
  # Barber, De George, Lehavy and Trueman (2013), JFE.
  - "microstructure: the reporting cycle. Stocks earn higher returns in the weeks a firm is expected to report, as attention-driven buying and the resolution of uncertainty concentrate there; a new report shows as the step of a statement field (e.g. netinc against its value a bar earlier), so the bars since the last step tell when the next report is due, together with the trading volume and the price move around the last one. Barber, De George, Lehavy and Trueman, The earnings announcement premium around the globe, Journal of Financial Economics."

evaluator:
  warmup_bars: 260
  njobs: 51            # KunQuant threads: at most 51 of Node 1's 64 cores

admission:
  t_threshold: 3.0
  max_correlation: 0.7
  min_monotonicity: 0.6
  min_coverage: 0.5    # a statement field is missing until a firm's first report (Q49)

round:
  candidates: 20
  min_per_type: 3
  retries: 2
  max_rounds: 30
  max_trials: 600
  patience: 5
  memory_every: 5
  seed: 0

context:
  recent_rounds: 5    # the planner lists the last 5 rounds' trials; older ones are counted (Q83)

acceptance:
  # The acceptance model: SEL0's xgb_deep (quantlab-experiment 2026-10-18-us3000-factor-selection-xgb),
  # without its thread count; quantlab puts xgboost on CUDA when there is one. Its factors are the
  # baseline: empty, the reference set (SEL0's 191 factors).
  model:
    name: quantlab.model.predefined.xgb.XGBoostRegressor
    factors: []
    hyperparameters: {training_target: cs_rank, early_stopping: true, early_stopping_patience: 100,
                      objective: "reg:squarederror", num_boost_round: 2000, eta: 0.03, max_depth: 6,
                      min_child_weight: 1000, subsample: 0.8, colsample_bytree: 0.5}
  seeds: [0, 1, 2]
  top_k: 100
  factor_root: /data/quantlab/factors/market   # exported stores, beside the other whole-market factors

# All four roles: DeepSeek V4 Pro on DeepSeek's own API. The spending limit is the account's prepaid
# balance (Q86): the library counts no money.
llm:
  planner:   &deepseek {backend: openai_compatible, model: deepseek-v4-pro,
                        base_url: "https://api.deepseek.com", api_key_env: DEEPSEEK_API_KEY,
                        max_tokens: 32000, timeout_seconds: 900}
  proposer:  *deepseek
  reviewer:  *deepseek
  distiller: *deepseek
