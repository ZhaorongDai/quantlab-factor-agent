# An example intraday campaign: us3000_ret5.yaml with the one-minute trade bars open beside daily
# price and volume, which candidate code computes on itself.
#
# The same prices, label, membership, scoring, reference, roles and acceptance as us3000_ret5.yaml;
# its own run_dir, segments, known factors and directions. data.intraday is the whole-market
# one-minute trade bars on permatickers (quantlab's MappedTradeBarDataset), read on SEP's roster as
# the shared minute factors read them; fields/massive_minute_bars.yaml is their field file. A
# candidate computes on each session's bars (its intraday stage), reduces each session to one value
# per stock and day with a session aggregation, and works on those daily values like any daily field.
run_dir: /data/quantlab/runs/factor_agent_us3000_intraday_ret5

# The data as the prompts describe it.
market: adjusted daily bars and one-minute trade bars of every regular session of every US common stock

# Every segment lies inside the minute bars, whose first session is 2016-10-10. The daily warm-up
# before it has no session values, so a candidate averaging them over n days is missing on the
# training segment's first n days, counted against its coverage.
segments:
  training:   {start: 2016-10-10, end: 2021-12-31}
  validation: {start: 2022-01-03, end: 2023-12-29}
  holdout:    {start: 2024-01-02, end: 2026-10-15}
  purge_bars: 5

data:
  prices:
    datasets:
    - zarr_file_path: /data/quantlab/market/sharadar/sharadar_sep_1d/sharadar_sep_1d.zarr
      start_date: '1900-01-01'
      end_date: '2100-01-01'
      symbols: null
      kwargs: null
      name: quantlab.dataset.sharadar.stock.SharadarStockDataset
      raw_data_dir_path: /data/quantlab/downloads/sharadar
      market: us_equity
      frequency: 1d
      vendor: sharadar
      table: sep
      permatickers: null
      roster_universe: null
      category_filter: [Domestic Common Stock, Domestic Common Stock Primary Class, Domestic Common Stock Secondary
          Class]
    name: quantlab.dataset.bad_prints.BadPrintMaskedDataset
    jump: 5.0
    volume_ratio: 20.0
    lookback: 20
    price_variable: adjClose
    volume_variable: adjVolume
    masked_variables: [open, high, low, close, adjOpen, adjHigh, adjLow, adjClose, marketcap]
    intrabar_variables: [adjOpen]
  label:
    label:
      warmup_bars: 15
      dataset:
        datasets:
        - zarr_file_path: /data/quantlab/market/sharadar/sharadar_sep_1d/sharadar_sep_1d.zarr
          start_date: '1900-01-01'
          end_date: '2100-01-01'
          symbols: null
          kwargs: null
          name: quantlab.dataset.sharadar.stock.SharadarStockDataset
          raw_data_dir_path: /data/quantlab/downloads/sharadar
          market: us_equity
          frequency: 1d
          vendor: sharadar
          table: sep
          permatickers: null
          roster_universe: null
          category_filter: [Domestic Common Stock, Domestic Common Stock Primary Class, Domestic Common Stock Secondary
              Class]
        name: quantlab.dataset.bad_prints.BadPrintMaskedDataset
        jump: 5.0
        volume_ratio: 20.0
        lookback: 20
        price_variable: adjClose
        volume_variable: adjVolume
        masked_variables: [open, high, low, close, adjOpen, adjHigh, adjLow, adjClose, marketcap]
        intrabar_variables: [adjOpen]
      file_path: /data/quantlab/labels/market/ret_5/ret_5.zarr
      factor_names: [ret_5]
      kwargs: {n_forward_periods: 5}
      resample_freq: null
      resample_how: null
      name: quantlab.label.predefined.fret.Return
      mode: batch
      data_columns: [adjOpen]
      njobs: 48
    membership:
      zarr_file_path: /data/quantlab/universe/us3000/membership_estu/membership_estu.zarr
      start_date: '2000-02-02'
      end_date: '2100-01-01'
      symbols: null
      kwargs: {barra_store: /data/quantlab/factors/market/barra_style/barra_style.zarr}
      name: quantlab.dataset.estu.EstuConstituentDataset
      as_of: null
    name: quantlab.label.predefined.membership_mask.MembershipMaskedLabel
  membership: /data/quantlab/universe/us3000/membership_estu
  # The one-minute trade bars an intraday family reads: Massive's trades in one-minute bars of each
  # regular session, mapped onto permatickers once and kept in their own store, read on the symbols
  # of SEP's domestic common stock (the store the daily prices read). Their session values are
  # matched to the daily bars by date and permaticker. The minute bars start on 2016-10-10.
  intraday:
    dataset:
      source:
        trade_bars:
          zarr_file_path: /data/quantlab/market/massive/massive_trade_bars_1m/massive_trade_bars_1m.zarr
          name: quantlab.dataset.massive.trade_bars.MassiveTradeBarDataset
          start_date: '2016-10-10'
          end_date: '2100-01-01'
          symbols: null
          kwargs: null
          raw_data_dir_path: /data/quantlab/downloads/massive
          market: us_equity
          frequency: tick
          vendor: massive
          bar_interval: 1m
          session_start: '09:30'
          session_end: '16:00'
          tickers: null
        ticker_map:
          path: /data/quantlab/market/massive/massive_ticker_map/massive_ticker_map
          massive_dir: /data/quantlab/downloads/massive
          sharadar_dir: /data/quantlab/downloads/sharadar
          name: quantlab.dataset.massive.ticker_map.TickerMap
        name: quantlab.dataset.massive.permaticker_bars.PermatickerTradeBarDataset
      zarr_file_path: /data/quantlab/market/massive/massive_permaticker_bars_1m/massive_permaticker_bars_1m.zarr
      name: quantlab.dataset.massive.mapped_bars.MappedTradeBarDataset
    roster:
      zarr_file_path: /data/quantlab/market/sharadar/sharadar_sep_1d/sharadar_sep_1d.zarr
      name: quantlab.dataset.sharadar.stock.SharadarStockDataset
      start_date: '1900-01-01'
      end_date: '2100-01-01'
      symbols: null
      kwargs: null
      raw_data_dir_path: /data/quantlab/downloads/sharadar
      market: us_equity
      frequency: 1d
      vendor: sharadar
      table: sep
      permatickers: null
      roster_universe: null
      category_filter:
      - Domestic Common Stock
      - Domestic Common Stock Primary Class
      - Domestic Common Stock Secondary Class
    name: quantlab.dataset.roster.RosterDataset
# Ranked across the market, neutralised against industry and log market cap, as the shared
# *_neutral stores are; masked to the members of day t (data.membership).
scoring:
  neutralize:
    exposures:
    - /data/quantlab/market/sharadar/sharadar_daily_1d
    - /data/quantlab/market/sharadar/sharadar_industry_1d
    size_column: marketcap
    industry_column: industry

# What candidates may write with (paths relative to this file).
fields: [fields/sharadar_price_volume.yaml, fields/massive_minute_bars.yaml]
operators: operators/kunquant_example.yaml

reference:
  - store: /data/quantlab/factors/market/alpha101_neutral
    factor_names: [alpha016, alpha015, alpha044, alpha013, alpha050, alpha055, alpha043, alpha040, alpha012, alpha003, alpha009,
        alpha026, alpha011, alpha007, alpha021, alpha041, alpha049, alpha005, alpha045, alpha023, alpha024,
        alpha006, alpha020, alpha002, alpha036, alpha078, alpha019, alpha081, alpha022, alpha030, alpha088,
        alpha099, alpha061, alpha034, alpha064, alpha027, alpha017, alpha028, alpha025, alpha039, alpha042,
        alpha008, alpha052, alpha075, alpha071, alpha004, alpha046, alpha074, alpha001, alpha037, alpha018,
        alpha065, alpha054, alpha085, alpha035, alpha066, alpha031, alpha094, alpha062, alpha047, alpha095,
        alpha096, alpha072, alpha073, alpha053, alpha077, alpha029, alpha068, alpha083, alpha086]
  - store: /data/quantlab/factors/market/fundamental_alpha_neutral
    factor_names: [cash_profitability, fcf_yield, operating_profitability, f_score, ebit_to_ev, earnings_sue, roe, composite_issuance,
        net_payout_yield, revenue_sue, insider_buyers, roa_change, investment_to_assets, io_change, insider_breadth,
        insider_purchase]
  - store: /data/quantlab/factors/market/alpha158_neutral
    factor_names: [CORR5, CORD5, LOW1, MIN10, VSUMN20, LOW2, CORD10, VSUMN60, VSUMN30, QTLD10, VSUMN10, VSUMN5, CORD20,
        MIN30, CORD30, QTLU5, VWAP4, QTLD20, VWAP0, CLOSE1, CORR20, CORR30, CORD60, HIGH1, RSV5, LOW0, ROC10,
        VOLUME1, MA30, CNTP5, RANK10, VOLUME3, KLOW, VOLUME2, KUP2, VOLUME4, KLOW2, VMA60, QTLU60, IMAX5, KMID2,
        MAX10, RSV20, KLEN, CORR60, IMAX10, IMAX20, IMIN5, CNTN60, HIGH0, CNTP10, STD10, VOLUME0, IMIN10, STD5,
        STD20, KUP, IMAX30, CNTP20, IMIN20, IMIN30, CLOSE0]
  - store: /data/quantlab/factors/market/barra_style
    factor_names: [style_residual_volatility, style_nonlinear_size, desc_etop, desc_lncap, desc_dastd, desc_cetop, desc_yild,
        desc_dtoa, desc_rstr, desc_cmra, desc_sgro, desc_egro, style_beta, desc_stoa]
  - store: /data/quantlab/factors/market/alternative_alpha_ear252_neutral
    factor_names: [earnings_announcement_return]
  - store: /data/quantlab/factors/market/intraday_low_corr
    factor_names: [hf_liquid_pv, hf_steady_close_small_trades, hf_close_pv_overnight, hf_auction_vwap, hf_lit_intraday,
        hf_liquid_vwap, hf_lit_steady_overnight, hf_liquid_reversal, hf_auction_rv]
  - store: /data/quantlab/factors/market/alternative_alpha_neutral
    factor_names: [lazy_prices_business, distress_events, lazy_prices_risk_jaccard, news_attention, news_sentiment, short_volume_ratio]
  - store: /data/quantlab/factors/market/intraday_signals
    factor_names: [hf_efficiency, hf_small_lit_trades, hf_close_liquidity]
  - store: /data/quantlab/factors/market/intraday_stats_20d_neutral
    factor_names: [corr_pv_20d, amihud_20d, trade_size_20d, ret_open30_20d]
  - store: /data/quantlab/factors/market/intraday_vol_liquidity
    factor_names: [liquid_60d, lowvol_10d]
  - store: /data/quantlab/factors/market/beta_spy_neutral
    factor_names: [beta]
  - store: /data/quantlab/factors/market/short_horizon_neutral
    factor_names: [intraday_20, reversal_3, intraday_5]

# Known factors besides the reference set: a candidate rewriting one of them is refused. Whole-market
# factor libraries of quantlab's factor families, and every stored factor of the minute bars: the
# price-volume factors averaging PriceVolumeIntradayStats's session statistics over several
# horizons, the 20-day means of every IntradayStats statistic, of which the reference holds four,
# and HfShortHorizonAlpha, 32 short-horizon factors from the same session statistics (stored raw:
# their correlation with a candidate is of normal scores per date, unneutralised). A candidate that
# recomputes one of those statistics from the minute bars and averages it meets that factor at
# admission, as a correlation above the limit.
known:
  - /data/quantlab/factors/market/alpha101_neutral
  - /data/quantlab/factors/market/alpha158_neutral
  - /data/quantlab/factors/market/fundamental_alpha_neutral
  - /data/quantlab/factors/market/daily_anomaly_neutral
  - /data/quantlab/factors/market/short_horizon_neutral
  - /data/quantlab/factors/market/barra_style
  - /data/quantlab/factors/market/price_volume_intraday_neutral
  - /data/quantlab/factors/market/intraday_stats_20d_neutral
  - /data/quantlab/factors/market/hf_short_horizon

# Seed directions: two per mechanism type, each a mechanism only the minute bars show, read from
# the minute fields. The known minute factors are means and variabilities of each session statistic
# and HfShortHorizonAlpha's tests of the obvious mechanisms (realized skewness, jumps, semibetas,
# order imbalance and its reversal, volatility shocks, high- and low-volume minute moves, the
# off-exchange share shock, closing-time periodicity), so no direction is one of those. Papers are
# cited without their year, so no prompt names a date after the training segment; the years are in
# the comments.
directions:
  # Barber and Odean (2008), RFS.
  - "behavioural_bias: attention buying at the open. Individual investors buy the stocks that catch their attention, and they trade at the open, after the news of the night; the price pressure of that buying reverses over the following weeks. The share of the session's volume (bar_volume) traded in its first bars (session_position), the odd-lot share of it (bar_oddlot_volume against bar_volume) marking small investors, over one to two weeks, not the overnight return or the plain volume. Barber and Odean, All that glitters: the effect of attention and news on the buying behavior of individual and institutional investors, Review of Financial Studies."
  # George and Hwang (2004), JF.
  - "behavioural_bias: anchoring on the session's extremes. Traders anchor on the prices they have just seen, so a stock that closes near the session's high (bar_high) while the news behind it is not yet absorbed keeps rising, and one closing near its low keeps falling; where the session's last price (last_price) lies between its least bar_low and greatest bar_high, averaged over a few weeks, not the daily close's place in the daily range. George and Hwang, The 52-week high and momentum investing, Journal of Finance."
  # Baltussen, van Bekkum and van der Grient (2018), JFQA.
  - "risk_compensation: uncertainty about risk. Investors averse to ambiguity pay less for stocks whose risk itself is uncertain; the variability within the session of the volatility of short-bar returns of last_price (the standard deviation of their absolute size against its mean), averaged over one to three months, not the session's volatility or its shock against the past. Baltussen, van Bekkum and van der Grient, Unknown unknowns: uncertainty about risk and stock returns, Journal of Financial and Quantitative Analysis."
  # Bogousslavsky (2021), JFE.
  - "risk_compensation: holding risk into the close. Institutions that may not hold risk overnight sell in the session's last bars, so stocks whose late-session moves carry most of the day's variance pay a premium to those who hold them through the night; the share of the session's variance of bar returns of last_price earned in its last bars (session_bars_left), over one to three months, not the late return's level or the closing-time periodicity. Bogousslavsky, The cross-section of intraday and overnight returns, Journal of Financial Economics."
  # Obizhaeva and Wang (2013), JFM.
  - "liquidity: resilience. A liquid market not only absorbs an order at a small price impact but recovers from it quickly, and a stock whose price keeps the impact of its large bars is costly to trade; the part of the move of the session's highest-volume bars (bar_volume against its session mean) that the next bars of last_price reverse, over one to three months, not the price impact itself. Obizhaeva and Wang, Optimal trading strategy and supply/demand dynamics, Journal of Financial Markets."
  # Chordia, Roll and Subrahmanyam (2001), JF.
  - "liquidity: liquidity dried up within the day. A stock whose trading stops on many bars of the session, bars without a trade (bar_trades of 0, bar_close missing), is hard to trade at a moment's notice even when its daily volume looks normal; the share of the session's bars without a trade, against its own past and across stocks of similar daily volume, over a few weeks, not the daily volume or the minute Amihud ratio. Chordia, Roll and Subrahmanyam, Market liquidity and trading activity, Journal of Finance."
  # O'Hara, Yao and Ye (2014), JF.
  - "microstructure: odd-lot trading. Informed traders split orders into odd lots, which before a rule change reached no quote and stayed invisible, so the odd-lot share of volume (bar_oddlot_volume against bar_volume) carries information the quotes do not; that share on the bars where the price moves (bar_close against the bar before) in the direction of the move, over one to two weeks, not the mean trade size. O'Hara, Yao and Ye, What's not there: odd lots and market data, Journal of Finance."
  # Lillo and Farmer (2004), SNDE.
  - "microstructure: persistent order flow. An order split over the session leaves its sign in many bars in a row, so the bar order imbalance (bar_buy_volume against bar_sell_volume) is correlated with itself a few bars later; how strongly it is, a package still being worked, with the sign of the session's imbalance, over one to two weeks, not the session's imbalance alone or its reversal. Lillo and Farmer, The long memory of the efficient market, Studies in Nonlinear Dynamics and Econometrics."
  # Chordia and Swaminathan (2000), JF.
  - "information_diffusion: volume leading prices. Information reaches some traders first, and their trading shows in volume before the price has moved; how strongly the session's bar volume (bar_volume) leads the size of the bar returns of last_price a few bars later, a stock whose price follows its trading with a delay, with the sign of the past week's return, not the volume level or the return alone. Chordia and Swaminathan, Trading volume and cross-autocorrelations in stock returns, Journal of Finance."
  # Barclay and Hendershott (2003), RFS.
  - "information_diffusion: late price discovery. Information that enters the price late in the session has had less time to be absorbed and its move continues the next days; the part of the session's move from its first last_price to its last made in its last bars (session_bars_left), weighted by the volume traded there (bar_volume), over one to two weeks, not the late return alone or the day's return. Barclay and Hendershott, Price discovery and trading after hours, Review of Financial Studies."

evaluator:
  warmup_bars: 260
  njobs: 51            # KunQuant threads

admission:
  t_threshold: 3.0
  max_correlation: 0.7
  min_monotonicity: 0.6

round:
  candidates: 20
  min_per_type: 3
  retries: 2
  max_rounds: 30
  max_trials: 600
  patience: 5
  memory_every: 5
  seed: 0
  groups: 4          # proposal groups whose calls run side by side

context:
  recent_rounds: 5    # the planner lists the last 5 rounds' trials; older ones are counted

acceptance:
  # The acceptance model: a deep xgboost on cross-sectional ranks; quantlab puts xgboost on CUDA when
  # there is one. Its factors are the baseline: empty, the reference set.
  model:
    name: quantlab.model.predefined.xgb.XGBoostRegressor
    factors: []
    hyperparameters: {training_target: cs_rank, early_stopping: true, early_stopping_patience: 100,
                      objective: "reg:squarederror", num_boost_round: 2000, eta: 0.03, max_depth: 6,
                      min_child_weight: 1000, subsample: 0.8, colsample_bytree: 0.5}
  seeds: [0, 1, 2]
  top_k: 100
  factor_root: /data/quantlab/factors/market   # exported stores, beside the other whole-market factors

# All four roles: DeepSeek V4 Pro on DeepSeek's own API. The library counts no money: the spending
# limit is the provider's (a prepaid balance or an account limit).
llm:
  planner:   &deepseek {backend: openai_compatible, model: deepseek-v4-pro,
                        base_url: "https://api.deepseek.com", api_key_env: DEEPSEEK_API_KEY,
                        max_tokens: 32000, timeout_seconds: 900}
  proposer:  *deepseek
  reviewer:  *deepseek
  distiller: *deepseek
