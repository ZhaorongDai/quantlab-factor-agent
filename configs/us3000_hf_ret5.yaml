# An example high-frequency campaign: us3000_ret5.yaml with the daily session statistics of
# one-minute trade bars open beside price and volume.
#
# The same label, membership, scoring, reference, roles and acceptance as us3000_ret5.yaml; its own
# run_dir, segments, known factors and directions. The price dataset merges whole-market SEP with two
# stores of session statistics built beforehand with quantlab (IntradayStats and
# PriceVolumeIntradayStats, resampled to one value per session), read through quantlab's
# FactorStoreDataset under the prefixes the field files name; bad prints are masked on SEP's prices.
run_dir: /data/quantlab/runs/factor_agent_us3000_hf_ret5

# The data as the prompts describe it.
market: adjusted daily bars and daily statistics of each session's one-minute trade bars of every US common stock

# Every segment lies inside the minute data, which starts 2016-10-11, so every date has the statistics.
segments:
  training:   {start: 2016-10-11, end: 2021-12-31}
  validation: {start: 2022-01-03, end: 2023-12-29}
  holdout:    {start: 2024-01-02, end: 2026-10-15}
  purge_bars: 5

data:
  prices:
    datasets:
    - zarr_file_path: /data/quantlab/market/sharadar/sharadar_sep_1d/sharadar_sep_1d.zarr
      start_date: '1900-01-01'
      end_date: '2100-01-01'
      symbols: null
      kwargs: null
      name: quantlab.dataset.sharadar.stock.SharadarStockDataset
      raw_data_dir_path: /data/quantlab/downloads/sharadar
      market: us_equity
      frequency: 1d
      vendor: sharadar
      table: sep
      permatickers: null
      roster_universe: null
      category_filter: [Domestic Common Stock, Domestic Common Stock Primary Class, Domestic Common Stock Secondary
          Class]
    # The session statistics, one value per stock and session, each known at its session's close.
    - zarr_file_path: /data/quantlab/factors/market/intraday_stats/intraday_stats_resample_1d.zarr
      prefix: trade_
      name: quantlab.dataset.factor_store.FactorStoreDataset
    - zarr_file_path: /data/quantlab/factors/market/price_volume_intraday_stats/price_volume_intraday_stats_resample_1d.zarr
      prefix: pv_
      name: quantlab.dataset.factor_store.FactorStoreDataset
    name: quantlab.dataset.bad_prints.BadPrintMaskedDataset
    jump: 5.0
    volume_ratio: 20.0
    lookback: 20
    price_variable: adjClose
    volume_variable: adjVolume
    masked_variables: [open, high, low, close, adjOpen, adjHigh, adjLow, adjClose, marketcap]
    intrabar_variables: [adjOpen]
  label:
    label:
      warmup_bars: 15
      dataset:
        datasets:
        - zarr_file_path: /data/quantlab/market/sharadar/sharadar_sep_1d/sharadar_sep_1d.zarr
          start_date: '1900-01-01'
          end_date: '2100-01-01'
          symbols: null
          kwargs: null
          name: quantlab.dataset.sharadar.stock.SharadarStockDataset
          raw_data_dir_path: /data/quantlab/downloads/sharadar
          market: us_equity
          frequency: 1d
          vendor: sharadar
          table: sep
          permatickers: null
          roster_universe: null
          category_filter: [Domestic Common Stock, Domestic Common Stock Primary Class, Domestic Common Stock Secondary
              Class]
        name: quantlab.dataset.bad_prints.BadPrintMaskedDataset
        jump: 5.0
        volume_ratio: 20.0
        lookback: 20
        price_variable: adjClose
        volume_variable: adjVolume
        masked_variables: [open, high, low, close, adjOpen, adjHigh, adjLow, adjClose, marketcap]
        intrabar_variables: [adjOpen]
      file_path: /data/quantlab/labels/market/ret_5/ret_5.zarr
      factor_names: [ret_5]
      kwargs: {n_forward_periods: 5}
      resample_freq: null
      resample_how: null
      name: quantlab.label.predefined.fret.Return
      mode: batch
      data_columns: [adjOpen]
      njobs: 48
    membership:
      zarr_file_path: /data/quantlab/universe/us3000/membership_estu/membership_estu.zarr
      start_date: '2000-02-02'
      end_date: '2100-01-01'
      symbols: null
      kwargs: {barra_store: /data/quantlab/factors/market/barra_style/barra_style.zarr}
      name: quantlab.dataset.estu.EstuConstituentDataset
      as_of: null
    name: quantlab.label.predefined.membership_mask.MembershipMaskedLabel
  membership: /data/quantlab/universe/us3000/membership_estu
# Ranked across the market, neutralised against industry and log market cap, as the shared
# *_neutral stores are; masked to the members of day t (data.membership).
scoring:
  neutralize:
    exposures:
    - /data/quantlab/market/sharadar/sharadar_daily_1d
    - /data/quantlab/market/sharadar/sharadar_industry_1d
    size_column: marketcap
    industry_column: industry

# What candidates may write with (paths relative to this file).
fields: [fields/sharadar_price_volume.yaml, fields/intraday_session.yaml, fields/intraday_price_volume.yaml]
operators: operators/kunquant_example.yaml

reference:
  - store: /data/quantlab/factors/market/alpha101_neutral
    factor_names: [alpha016, alpha015, alpha044, alpha013, alpha050, alpha055, alpha043, alpha040, alpha012, alpha003, alpha009,
        alpha026, alpha011, alpha007, alpha021, alpha041, alpha049, alpha005, alpha045, alpha023, alpha024,
        alpha006, alpha020, alpha002, alpha036, alpha078, alpha019, alpha081, alpha022, alpha030, alpha088,
        alpha099, alpha061, alpha034, alpha064, alpha027, alpha017, alpha028, alpha025, alpha039, alpha042,
        alpha008, alpha052, alpha075, alpha071, alpha004, alpha046, alpha074, alpha001, alpha037, alpha018,
        alpha065, alpha054, alpha085, alpha035, alpha066, alpha031, alpha094, alpha062, alpha047, alpha095,
        alpha096, alpha072, alpha073, alpha053, alpha077, alpha029, alpha068, alpha083, alpha086]
  - store: /data/quantlab/factors/market/fundamental_alpha_neutral
    factor_names: [cash_profitability, fcf_yield, operating_profitability, f_score, ebit_to_ev, earnings_sue, roe, composite_issuance,
        net_payout_yield, revenue_sue, insider_buyers, roa_change, investment_to_assets, io_change, insider_breadth,
        insider_purchase]
  - store: /data/quantlab/factors/market/alpha158_neutral
    factor_names: [CORR5, CORD5, LOW1, MIN10, VSUMN20, LOW2, CORD10, VSUMN60, VSUMN30, QTLD10, VSUMN10, VSUMN5, CORD20,
        MIN30, CORD30, QTLU5, VWAP4, QTLD20, VWAP0, CLOSE1, CORR20, CORR30, CORD60, HIGH1, RSV5, LOW0, ROC10,
        VOLUME1, MA30, CNTP5, RANK10, VOLUME3, KLOW, VOLUME2, KUP2, VOLUME4, KLOW2, VMA60, QTLU60, IMAX5, KMID2,
        MAX10, RSV20, KLEN, CORR60, IMAX10, IMAX20, IMIN5, CNTN60, HIGH0, CNTP10, STD10, VOLUME0, IMIN10, STD5,
        STD20, KUP, IMAX30, CNTP20, IMIN20, IMIN30, CLOSE0]
  - store: /data/quantlab/factors/market/barra_style
    factor_names: [style_residual_volatility, style_nonlinear_size, desc_etop, desc_lncap, desc_dastd, desc_cetop, desc_yild,
        desc_dtoa, desc_rstr, desc_cmra, desc_sgro, desc_egro, style_beta, desc_stoa]
  - store: /data/quantlab/factors/market/alternative_alpha_ear252_neutral
    factor_names: [earnings_announcement_return]
  - store: /data/quantlab/factors/market/intraday_low_corr
    factor_names: [hf_liquid_pv, hf_steady_close_small_trades, hf_close_pv_overnight, hf_auction_vwap, hf_lit_intraday,
        hf_liquid_vwap, hf_lit_steady_overnight, hf_liquid_reversal, hf_auction_rv]
  - store: /data/quantlab/factors/market/alternative_alpha_neutral
    factor_names: [lazy_prices_business, distress_events, lazy_prices_risk_jaccard, news_attention, news_sentiment, short_volume_ratio]
  - store: /data/quantlab/factors/market/intraday_signals
    factor_names: [hf_efficiency, hf_small_lit_trades, hf_close_liquidity]
  - store: /data/quantlab/factors/market/intraday_stats_20d_neutral
    factor_names: [corr_pv_20d, amihud_20d, trade_size_20d, ret_open30_20d]
  - store: /data/quantlab/factors/market/intraday_vol_liquidity
    factor_names: [liquid_60d, lowvol_10d]
  - store: /data/quantlab/factors/market/beta_spy_neutral
    factor_names: [beta]
  - store: /data/quantlab/factors/market/short_horizon_neutral
    factor_names: [intraday_20, reversal_3, intraday_5]

# Known factors besides the reference set: a candidate rewriting one of them is refused. Whole-market
# factor libraries of quantlab's factor families; the minute price-volume factors that average the
# PriceVolumeIntradayStats statistics over several horizons; the 20-day means of every IntradayStats
# statistic, of which the reference holds four; and HfShortHorizonAlpha, 32 short-horizon factors from
# the same session statistics (stored raw: their correlation with a candidate is of normal scores
# per date, unneutralised).
known:
  - /data/quantlab/factors/market/alpha101_neutral
  - /data/quantlab/factors/market/alpha158_neutral
  - /data/quantlab/factors/market/fundamental_alpha_neutral
  - /data/quantlab/factors/market/daily_anomaly_neutral
  - /data/quantlab/factors/market/short_horizon_neutral
  - /data/quantlab/factors/market/barra_style
  - /data/quantlab/factors/market/price_volume_intraday_neutral
  - /data/quantlab/factors/market/intraday_stats_20d_neutral
  - /data/quantlab/factors/market/hf_short_horizon

# Seed directions: two per mechanism type, aimed at mechanisms the known high-frequency factors have
# not tried. Those are means and variabilities of every session statistic over 1 to 120 days, and
# HfShortHorizonAlpha's tests of the obvious mechanisms on us3000, most of which failed: weekly
# realized skewness and signed jump variation, jump continuation and jump drift, downside semibeta,
# weekly order imbalance and opening and closing order-flow reversal, volatility and visibility
# shocks, high- and low-volume minute moves, the off-exchange share shock, closing-time periodicity
# and many reversals; its liquidity shock passed. So no direction below is a mean of one statistic,
# a shock of one against its own history, or one of those mechanisms: each is a relation between
# statistics that a paper prices. Papers are cited without their year, so no prompt names a date
# after the training segment; the years are in the comments.
directions:
  # Boehmer, Jones, Zhang and Zhang (2021), JF; Kelley and Tetlock (2013), JF.
  - "behavioural_bias: retail order flow on off-exchange sessions. Most retail marketable orders are filled off exchange, and the net direction of retail order flow predicts returns over the following weeks with the sign of the flow, as retail investors trade on information prices absorb slowly; the tick-rule order imbalance (trade_oib) weighted by the session's off-exchange share (trade_offexchange_share), summed over one to two weeks, not the plain imbalance or a shock to the off-exchange share. Boehmer, Jones, Zhang and Zhang, Tracking retail investor activity, Journal of Finance; Kelley and Tetlock, How wise are crowds? Insights from retail orders and stock returns, Journal of Finance."
  # Kumar (2009), JF; Bali, Cakici and Whitelaw (2011), JFE.
  - "behavioural_bias: lottery features of the trading day. Investors who gamble overpay for stocks whose payoffs look like lotteries, cheap stocks with rare large upward bursts, so those stocks earn less; the upward moves on the session's high-volume minutes (pv_VOL_UP_RET_POS_MEAN) against the downward ones (pv_VOL_UP_RET_NEG_MEAN), in stocks traded in small trades (trade_trade_size), over a few weeks, not the realized skewness of all minutes or the mean of one statistic. Kumar, Who gambles in the stock market?, Journal of Finance; Bali, Cakici and Whitelaw, Maxing out: stocks as lotteries and the cross-section of expected returns, Journal of Financial Economics."
  # Hendershott, Livdan and Rosch (2020), JFE.
  - "risk_compensation: overnight risk. Risk borne while the market is closed cannot be traded away, and the risk premium of stocks is earned over the night rather than during the day; the share of a stock's return variance that arises overnight, the squared overnight return (trade_ret_overnight) against it plus the session's realized variance (trade_rvol squared), over one to three months, not the mean overnight return or the total volatility. Hendershott, Livdan and Rosch, Asset pricing: a tale of night and day, Journal of Financial Economics."
  # Acharya and Pedersen (2005), JFE.
  - "risk_compensation: liquidity risk of the stock's own returns. A stock whose illiquidity rises when its price falls is hard to sell exactly when its holders need to, and investors demand a premium for that; the rolling correlation over two to six months between the daily change of the minute Amihud ratio (trade_amihud) and the daily return, not the level of illiquidity, its variability or its shock against the past. Acharya and Pedersen, Asset pricing with liquidity risk, Journal of Financial Economics."
  # Brennan, Huh and Subrahmanyam (2013), RAPS.
  - "liquidity: the cost of selling. Only the illiquidity of down days, the price impact of selling, carries the Amihud premium; the minute Amihud ratio (trade_amihud) averaged over the sessions with a negative intraday return (trade_ret_intraday) against its average over the sessions with a positive one, over one to three months, not the illiquidity of all days. Brennan, Huh and Subrahmanyam, An analysis of the Amihud illiquidity premium, Review of Asset Pricing Studies."
  # Kyle (1985), Econometrica; Brennan and Subrahmanyam (1996), JFE.
  - "liquidity: price impact of order flow. Market makers move the price against informed order flow, and the price moved per unit of net order flow, Kyle's lambda, is an illiquidity investors are paid to bear; the slope of the session's return (trade_ret_intraday) on its order imbalance (trade_oib) over the last one to three months, a sensitivity rather than the imbalance itself or its persistence. Kyle, Continuous auctions and insider trading, Econometrica; Brennan and Subrahmanyam, Market microstructure and asset pricing: on the compensation for illiquidity in stock returns, Journal of Financial Economics."
  # Corwin and Schultz (2012), JF; Amihud and Mendelson (1986), JFE.
  - "microstructure: the spread in minute ranges. A minute's high-low range holds both the volatility and the bid-ask spread, so the mean minute amplitude (pv_AMP_MEAN) in excess of what the minute return volatility (pv_RET_STD) implies estimates the effective spread, and stocks with wider spreads earn a premium for their trading cost; the amplitude against the volatility, not either alone. Corwin and Schultz, A simple way to estimate bid-ask spreads from daily high and low prices, Journal of Finance; Amihud and Mendelson, Asset pricing and the bid-ask spread, Journal of Financial Economics."
  # Chan and Lakonishok (1995), JF; Barclay and Warner (1993), JFE.
  - "microstructure: unfinished institutional orders. Institutions split large orders over the day and over several days, and prices keep moving in the direction of an order package until it is filled; a session with many separate volume peaks (pv_VOL_UP_NUM) and an intraday return in the direction of its order imbalance (trade_oib) marks a package being worked, whose move continues over the next days, not the number of peaks or the imbalance alone. Chan and Lakonishok, The behavior of stock prices around institutional trades, Journal of Finance; Barclay and Warner, Stealth trading and volatility: which trades move prices?, Journal of Financial Economics."
  # Da, Gurun and Warachka (2014), RFS.
  - "information_diffusion: continuous versus discrete information. Investors underreact to information that arrives in many small moves more than to the same news in a few large jumps, so a past return earned with a low jump share of the minute variance persists longer; the past month's return (from the daily closes) conditioned on the mean jump share (trade_jump) or the realized kurtosis (trade_rkurt) of its sessions, not the size of the past return alone or the sign count of daily returns. Da, Gurun and Warachka, Frog in the pan: continuous information and momentum, Review of Financial Studies."
  # Hou and Moskowitz (2005), RFS.
  - "information_diffusion: delayed price discovery. Prices that absorb information slowly underreact to it, so a past return of a stock whose price adjusts with a delay continues longer; the past month's return (from the daily closes) conditioned on the first-order autocorrelation of its minute returns (trade_ret_autocorr, positive when moves are absorbed over several minutes), not the size of the past return or the autocorrelation alone. Hou and Moskowitz, Market frictions, price delay, and the cross-section of expected returns, Review of Financial Studies."

evaluator:
  warmup_bars: 260
  njobs: 51            # KunQuant threads

admission:
  t_threshold: 3.0
  max_correlation: 0.7
  min_monotonicity: 0.6

round:
  candidates: 20
  min_per_type: 3
  retries: 2
  max_rounds: 30
  max_trials: 600
  patience: 5
  memory_every: 5
  seed: 0
  groups: 4          # proposal groups whose calls run side by side

context:
  recent_rounds: 5    # the planner lists the last 5 rounds' trials; older ones are counted

acceptance:
  # The acceptance model: a deep xgboost on cross-sectional ranks; quantlab puts xgboost on CUDA when
  # there is one. Its factors are the baseline: empty, the reference set.
  model:
    name: quantlab.model.predefined.xgb.XGBoostRegressor
    factors: []
    hyperparameters: {training_target: cs_rank, early_stopping: true, early_stopping_patience: 100,
                      objective: "reg:squarederror", num_boost_round: 2000, eta: 0.03, max_depth: 6,
                      min_child_weight: 1000, subsample: 0.8, colsample_bytree: 0.5}
  seeds: [0, 1, 2]
  top_k: 100
  factor_root: /data/quantlab/factors/market   # exported stores, beside the other whole-market factors

# All four roles: DeepSeek V4 Pro on DeepSeek's own API. The library counts no money: the spending
# limit is the provider's (a prepaid balance or an account limit).
llm:
  planner:   &deepseek {backend: openai_compatible, model: deepseek-v4-pro,
                        base_url: "https://api.deepseek.com", api_key_env: DEEPSEEK_API_KEY,
                        max_tokens: 32000, timeout_seconds: 900}
  proposer:  *deepseek
  reviewer:  *deepseek
  distiller: *deepseek
