# Price and volume: Sharadar SEP's split- and dividend-adjusted daily bars, as Alpha158Stock reads
# them, with the adjusted typical price as vwap and vwap * volume as amount.
#
# Each field:
#   name         what candidate code reads
#   column       the price dataset's column it reads, or
#   formula      for a derived field, an expression over the family's fields listed before it,
#                under the same syntax rules as candidate code
#   unit         a product of powers of dollars and shares (dollars/shares, shares, dollars^2, 1);
#                a derived field's follows from its formula
#   description  one line in the prompt
#
# `bar: true` makes a value missing in any of the family's columns a missing bar, which the
# NaN-preserving operators keep NaN.
#
# A family of periodic data (financial statements) may declare a period lag, which lets candidate
# code write `PeriodLag(x, k)` for a field x of the family read from a column; this one has none:
#   period_lag:
#     column: '{column}__q{k}'    # the name a lag is read under, as quantlab's FundamentalAlpha names it
#     k: [1, 2, 3, 4, 8]          # the allowed k
#     period:
#       description: ...          # what a period is, in the prompt
#       key: reportperiod         # the price dataset's column holding the period end of the report shown
#       days: 91                  # the spacing of consecutive periods in days, and the tolerance on it
#       tolerance_days: 45
#       bars: 63                  # the most bars one period spans, for the warm-up a lag reads
family: price_volume
description: adjusted daily bars
bar: true

fields:
  - name: open
    column: adjOpen
    unit: dollars/shares
    description: opening price
  - name: high
    column: adjHigh
    unit: dollars/shares
    description: highest price of the day
  - name: low
    column: adjLow
    unit: dollars/shares
    description: lowest price of the day
  - name: close
    column: adjClose
    unit: dollars/shares
    description: closing price
  - name: volume
    column: adjVolume
    unit: shares
    description: shares traded in the day
  - name: vwap
    formula: (high + low + close) / 3.0
    description: typical price of the day, (high + low + close) / 3
  - name: amount
    formula: vwap * volume
    description: dollars traded in the day, vwap * volume
