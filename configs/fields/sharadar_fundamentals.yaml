# Sharadar fundamentals: SF1 as-reported trailing-twelve-month (ART) statement items and DAILY's
# valuation metrics, on the merged SEP + DAILY + SF1 ART panel quantlab's FundamentalAlpha reads.
# Reviewed and approved by the user for the first fundamentals campaign (2026-10-24; design Q44, Q52).
#
# - Fields are named after their vendor columns (design Q51), so the zoo recognises a rewrite of a
#   FundamentalAlpha factor, which reads the same columns.
# - Income-statement and cash-flow items are trailing-twelve-month totals; balance-sheet items are
#   the period-end values of the report shown; the *avg items average the trailing four quarters.
#   Each bar shows the latest report released by that day (quantlab.dataset.sharadar.fundamentals),
#   so every SF1 field is a step function that changes on filing days.
# - Amounts are in the reporting currency, which is US dollars for the US domestic common stocks of
#   the panel; DAILY's marketcap and ev are in dollars (quantlab converts the vendor's millions).
#   SF1's own marketcap and ev go by sf1_marketcap and sf1_ev in the merged panel, so marketcap and
#   ev here are DAILY's daily values.
# - Signs follow the cash-flow statement: capex, ncfdiv and ncfcommon are negative for outflows
#   (investment, dividends paid, net buybacks).
# - No per-share items (eps, bvps, dps, sps, ...) and no unadjusted prices (design Q47): an adjusted
#   price divided by an as-reported per-share number is wrong across a split. Valuations use totals
#   (netinc / marketcap) or DAILY's ready ratios. No share count either: SF1's are as reported, not on
#   adjVolume's split-adjusted basis; turnover is amount / marketcap.
#
# See sharadar_price_volume.yaml for the keys of a field file.
family: sharadar_fundamentals
description: SF1 trailing-twelve-month statement items and DAILY valuations

period_lag:
  column: '{column}__q{k}'          # FundamentalAlpha's names for its report lags
  k: [1, 2, 3, 4, 8]
  period:
    description: >-
      one quarterly SF1 report (each holds trailing-twelve-month totals, so k = 4 is the
      report a year earlier); a DAILY field's lag is its value on the last day that report was shown
    key: reportperiod                # SF1's fiscal period end of the report a bar shows
    days: 91.3                       # FundamentalAlpha's quarter_days and lag_tolerance_days
    tolerance_days: 45
    bars: 63

fields:
  # Income statement, trailing twelve months.
  - name: revenue
    column: revenue
    unit: dollars
    description: revenue (sales), trailing twelve months
  - name: cor
    column: cor
    unit: dollars
    description: cost of revenue, trailing twelve months
  - name: gp
    column: gp
    unit: dollars
    description: gross profit, revenue - cor, trailing twelve months
  - name: sgna
    column: sgna
    unit: dollars
    description: selling, general and administrative expense, trailing twelve months
  - name: rnd
    column: rnd
    unit: dollars
    description: research and development expense, trailing twelve months
  - name: opinc
    column: opinc
    unit: dollars
    description: operating income, trailing twelve months
  - name: intexp
    column: intexp
    unit: dollars
    description: interest expense, trailing twelve months
  - name: ebit
    column: ebit
    unit: dollars
    description: earnings before interest and taxes, trailing twelve months
  - name: ebitda
    column: ebitda
    unit: dollars
    description: earnings before interest, taxes, depreciation and amortisation, trailing twelve months
  - name: netinc
    column: netinc
    unit: dollars
    description: net income, trailing twelve months

  # Balance sheet, as of the report's period end.
  - name: assets
    column: assets
    unit: dollars
    description: total assets
  - name: assetsavg
    column: assetsavg
    unit: dollars
    description: total assets averaged over the trailing four quarters
  - name: assetsc
    column: assetsc
    unit: dollars
    description: current assets
  - name: cashneq
    column: cashneq
    unit: dollars
    description: cash and cash equivalents
  - name: receivables
    column: receivables
    unit: dollars
    description: trade and non-trade receivables
  - name: inventory
    column: inventory
    unit: dollars
    description: inventory
  - name: ppnenet
    column: ppnenet
    unit: dollars
    description: property, plant and equipment, net of depreciation
  - name: liabilities
    column: liabilities
    unit: dollars
    description: total liabilities
  - name: liabilitiesc
    column: liabilitiesc
    unit: dollars
    description: current liabilities
  - name: debt
    column: debt
    unit: dollars
    description: total debt, current and non-current
  - name: debtnc
    column: debtnc
    unit: dollars
    description: non-current (long-term) debt
  - name: equity
    column: equity
    unit: dollars
    description: shareholders' equity (book equity)
  - name: equityavg
    column: equityavg
    unit: dollars
    description: shareholders' equity averaged over the trailing four quarters
  - name: retearn
    column: retearn
    unit: dollars
    description: retained earnings (accumulated deficit when negative)

  # Cash flow statement, trailing twelve months.
  - name: ncfo
    column: ncfo
    unit: dollars
    description: net cash flow from operations, trailing twelve months
  - name: capex
    column: capex
    unit: dollars
    description: capital expenditure, trailing twelve months; negative for investment
  - name: fcf
    column: fcf
    unit: dollars
    description: free cash flow, ncfo + capex, trailing twelve months
  - name: ncfdiv
    column: ncfdiv
    unit: dollars
    description: dividends paid, trailing twelve months; negative when paid
  - name: ncfcommon
    column: ncfcommon
    unit: dollars
    description: net cash from issuing (positive) or buying back (negative) common stock, trailing twelve months

  # SF1 ratios.
  - name: currentratio
    column: currentratio
    unit: 1
    description: current ratio, assetsc / liabilitiesc
  - name: grossmargin
    column: grossmargin
    unit: 1
    description: gross margin, gp / revenue, trailing twelve months
  - name: assetturnover
    column: assetturnover
    unit: 1
    description: asset turnover, revenue / assetsavg, trailing twelve months

  # DAILY valuations, computed by the vendor from the day's price and the latest filing.
  - name: marketcap
    column: marketcap
    unit: dollars
    description: market capitalisation of the day
  - name: ev
    column: ev
    unit: dollars
    description: enterprise value of the day, marketcap + debt - cashneq
  - name: pe
    column: pe
    unit: 1
    description: price-to-earnings, marketcap / trailing net income to common; negative on a loss
  - name: pb
    column: pb
    unit: 1
    description: price-to-book, marketcap / equity
  - name: ps
    column: ps
    unit: 1
    description: price-to-sales, marketcap / trailing revenue
  - name: evebit
    column: evebit
    unit: 1
    description: enterprise value over trailing EBIT
  - name: evebitda
    column: evebitda
    unit: 1
    description: enterprise value over trailing EBITDA
